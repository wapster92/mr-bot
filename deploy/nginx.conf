# /etc/nginx/sites-available/mr-bot.conf

upstream mr_bot_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream mr_bot_mongoku {
    server 127.0.0.1:3100;
    keepalive 8;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mr-bot.almi-partner.ru;

    ssl_certificate /etc/nginx/ssl/mr-bot.crt;
    ssl_certificate_key /etc/nginx/ssl/mr-bot.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Убираем любую буферизацию, чтобы Telegram быстрее получал ответ
    proxy_buffering off;

    location /healthz {
        proxy_pass http://mr_bot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /telegram/webhook {
        proxy_pass http://mr_bot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 90s;
    }

    # Все остальные запросы (включая GitLab вебхуки) проксируем в приложение
    location / {
        proxy_pass http://mr_bot_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dbpanel {
        return 301 /dbpanel/;
    }

    location /dbpanel/ {
        proxy_pass http://mr_bot_mongoku;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
