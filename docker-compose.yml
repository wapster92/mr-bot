services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-mr-bot}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  mongoku:
    image: ghcr.io/mongoku/mongoku:latest
    restart: unless-stopped
    environment:
      MONGOKU_SERVER: 0.0.0.0
      MONGOKU_PORT: 3100
      MONGOKU_DATABASE_URL: ${MONGOKU_DATABASE_URL}
      MONGOKU_DB: ${MONGOKU_DB:-mr-bot}
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      - mongo

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
